<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polytechnic | Nigeria Grading System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="container">
          <nav class="navbar navbar-expand-lg bg-white px-0">
            <a class="navbar-brand fw-bold" href="index.html">Nigeria Grading System</a>
            <button
              class="navbar-toggler border-0"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavAltMarkup"
              aria-controls="navbarNavAltMarkup"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
              <div class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                <a class="nav-link text-dark fw-medium" href="secondary.html">Secondary School</a>
                <a class="nav-link text-dark fw-medium active" href="poly.html" aria-current="page">Polytechnic</a>
                <a class="nav-link text-dark fw-medium" href="university.html">University</a>
              </div>
            </div>
          </nav>
        </div>
      </header>

      <main class="page-main">
        <div class="container py-5">
          <div class="page-intro text-center mx-auto">
            <h1>Polytechnic</h1>
            <p>Calculate your polytechnic CGPA using the grading scale.</p>
          </div>

          <div class="calculator-card mx-auto">
            <div class="calculator-inner">
              <label for="input" class="form-label visually-hidden">Enter CGPA</label>
              <input type="text" id="input" placeholder="Enter your CGPA" maxlength="4"/>
              <button onclick="checkPoly()" type="button">Check</button>
              <div class="justify-content-center" id="displayArea" aria-live="polite">Your result will show here!</div>
            </div>
          </div>
        </div>
      </main>

      <footer class="site-footer">
        <div class="container">
          <p>Nigeria Education Grading System</p>
          <p>© <span id="year"></span></p>
        </div>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="script.js"></script>
  </body>
</html>
